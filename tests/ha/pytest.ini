# The Home Assistant tier: `python -m pytest tests/ha` in a venv with
# requirements_test_ha.txt (see CONTRIBUTING.md). Its own ini, so the pure tests in
# tests/ keep running without Home Assistant and without this configuration.
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# The repository root, so `custom_components.ilife` imports as Home Assistant loads it.
pythonpath = ../..
